<circle cx="59" cy="303" r="5" fill="none" stroke="#22c55e" stroke-width="1.5"><animate attributeName="r" values="5;14;14" keyTimes="0;.7;1" dur="2.8s" calcMode="spline" keySplines=".16 1 .3 1;0 0 1 1" repeatCount="indefinite"/><animate attributeName="opacity" values=".55;0;0" keyTimes="0;.7;1" dur="2.8s" calcMode="spline" keySplines=".16 1 .3 1;0 0 1 1" repeatCount="indefinite"/></circle>
<circle cx="59" cy="303" r="5" fill="#22c55e"><animate attributeName="opacity" values="1;.7;1" dur="2.8s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/></circle>
