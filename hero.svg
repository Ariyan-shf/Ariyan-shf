<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0b0f14"/>
    <stop offset="100%" stop-color="#111827"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#243040" stroke-width="1" opacity=".35"/>
  </pattern>
    <pattern id="gridHi" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-width="1" opacity=".45"/>
  </pattern>
  <radialGradient id="spot">
    <stop offset="0" stop-color="#fff"/>
    <stop offset=".55" stop-color="#fff" stop-opacity=".35"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#cbd5e1" stop-opacity=".07"/>
    <stop offset="1" stop-color="#cbd5e1" stop-opacity="0"/>
  </radialGradient>
  <mask id="spotMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="360">
    <circle r="300" fill="url(#spot)">
      <animate attributeName="cx" values="180;1020;180" dur="14s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
      <animate attributeName="cy" values="110;250;110" dur="9.5s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
    </circle>
  </mask>
  <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="sheen" maskUnits="userSpaceOnUse" x="-20" y="-20" width="355" height="230">
    <rect x="-260" y="-140" width="170" height="470" fill="url(#band)" transform="rotate(22 157 95)">
      <animate attributeName="x" values="-260;420;420" keyTimes="0;.42;1" dur="8s" begin="1.5s" calcMode="spline" keySplines=".45 0 .55 1;0 0 1 1" repeatCount="indefinite"/>
    </rect>
  </mask>
</defs>
<rect width="1200" height="360" rx="18" fill="url(#bg)"/>
<rect width="1200" height="360" rx="18" fill="url(#grid)"/>
<g mask="url(#spotMask)"><rect width="1200" height="360" rx="18" fill="url(#gridHi)"/></g>
<circle r="340" fill="url(#glow)"><animate attributeName="cx" values="180;1020;180" dur="14s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/><animate attributeName="cy" values="110;250;110" dur="9.5s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/></circle>
<rect x="28" y="28" width="1144" height="304" rx="12" fill="none" stroke="#334155"/>
<circle cx="58" cy="58" r="6" fill="#64748b"/><circle cx="80" cy="58" r="6" fill="#64748b"/><circle cx="102" cy="58" r="6" fill="#64748b"/>
<text x="52" y="112" fill="#94a3b8" font-family="monospace" font-size="18">$ whoami</text>
<text x="52" y="158" fill="#f8fafc" font-family="monospace" font-size="42" font-weight="700">ARIYAN</text>
<text x="52" y="190" fill="#94a3b8" font-family="monospace" font-size="18">developer · builder · AI explorer</text>
