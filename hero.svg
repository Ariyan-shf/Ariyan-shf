    <rect width="315" height="190" rx="12" fill="#fff" fill-opacity=".045"/>
    <rect x=".5" y=".5" width="314" height="189" rx="11.5" fill="none" stroke="#e2e8f0" stroke-opacity=".75"/>
  </g>
  <text x="22" y="34" fill="#94a3b8" font-family="monospace" font-size="14">CURRENT_STACK</text>
  <text x="22" y="68" fill="#e2e8f0" font-family="monospace" font-size="15" xml:space="preserve">Python    React    Node</text>
  <text x="22" y="98" fill="#e2e8f0" font-family="monospace" font-size="15" xml:space="preserve">Linux     Docker   SQL</text>
  <text x="22" y="128" fill="#e2e8f0" font-family="monospace" font-size="15" xml:space="preserve">Ollama    n8n      AI</text>
